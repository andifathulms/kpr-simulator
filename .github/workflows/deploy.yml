name: build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. packageManager in package.json is the
      # single source of truth, and naming it in both places is an error the
      # action refuses outright.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Rule validation gates everything. An uncited parameter, a gap in a
      # parameter's history, or a source URL that is not https fails here
      # rather than reaching someone about to make a twenty-year decision.
      - run: pnpm rules:validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:run

      - run: pnpm build
      - name: Confirm the export is servable by Pages
        run: |
          test -f out/.nojekyll || { echo "out/.nojekyll missing"; exit 1; }
          test -f out/kpr-simulator/id/index.html || test -f out/id/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # Pages deployment is manual, not automatic.
  #
  # actions/deploy-pages has never completed on this account: the deployment
  # API is accepted and then never progresses, and the step times out after
  # ten minutes. Pages is configured correctly — build_type is workflow, the
  # repository is public, the artifact uploads fine — so the fault is not in
  # this workflow, and leaving it on `push` would mark every future commit
  # red for a reason unrelated to the commit.
  #
  # `verify` still gates every push, and it is the job that matters: rule
  # validation, types, lint, 1614 tests, and a build whose export is checked
  # for the two files Pages needs. The artifact it uploads can be downloaded
  # from the run, or served anywhere static.
  #
  # To retry a deploy, run this workflow manually from the Actions tab. When
  # Pages starts working, restore `push` to the `if` below.
  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
