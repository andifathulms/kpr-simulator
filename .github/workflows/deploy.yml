name: build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Redundant verifies are worth cancelling; a deployment in flight is not. The
# deploy job carries its own group below so a second push cannot cancel a
# publish half-way through and leave the live site on a partial upload.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. packageManager in package.json is the
      # single source of truth, and naming it in both places is an error the
      # action refuses outright.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Rule validation gates everything. An uncited parameter, a gap in a
      # parameter's history, or a source URL that is not https fails here
      # rather than reaching someone about to make a twenty-year decision.
      - run: pnpm rules:validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:run

      - run: pnpm build
      # Guards invariant 13 against the built output rather than trusting it.
      - run: pnpm check:offline
      - name: Confirm the export is servable by Pages
        run: |
          test -f out/.nojekyll || { echo "out/.nojekyll missing"; exit 1; }
          test -f out/kpr-simulator/id/index.html || test -f out/id/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # Deploys on every push to main, and on demand.
  #
  # This job was manual-only for a while: actions/deploy-pages was accepted by
  # the deployment API and then sat at deployment_in_progress until its own
  # ten-minute timeout, on a repository that was configured correctly the whole
  # time. It began working on 2026-08-07 with no change to this workflow, the
  # export, or the Pages settings, which places the fault outside the
  # repository. The first successful deployment completed in fourteen seconds.
  #
  # If it regresses, it will show as this job hanging rather than failing fast.
  # `verify` is the job that gates correctness and it runs on every push
  # regardless; the artifact it uploads can be served anywhere static.
  #
  # Never deploy a pull request: the artifact would publish unreviewed work to
  # the live site.
  deploy:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
